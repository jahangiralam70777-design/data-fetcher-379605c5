services:
  - type: web
    name: caaspirebd
    runtime: node
    plan: standard
    region: oregon
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: "sh -c 'ls dist/server/*.{js,mjs} >/dev/null 2>&1 || npm run build; node render-start.mjs'"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/public/health
