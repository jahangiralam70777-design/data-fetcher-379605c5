services:
  - type: web
    name: caaspirebd
    runtime: node
    plan: standard
    region: oregon
    branch: main
    buildCommand: npm install --include=dev && npm run build && test -f dist/server/index.mjs
    startCommand: "sh -c 'test -f dist/server/index.mjs || npm run build && node render-start.mjs'"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/public/health
